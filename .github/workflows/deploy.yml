name: Validate and deploy to Netlify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: netlify-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrations:
    name: Validate Supabase migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v2
        with:
          version: 2.115.0

      - name: Apply migrations to a clean local database
        run: |
          supabase start
          supabase db reset --local --no-seed

      - name: Clean up local database
        if: always()
        run: supabase stop --no-backup

  build:
    name: Build with Netlify configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5
          cache: true

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Edge Function tests
        run: npm test

      - name: Build
        run: npx netlify-cli@latest build --context production
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: 9a9edc3b-04e4-431f-8927-f946900b0b27

      - name: Upload production-ready build
        uses: actions/upload-artifact@v4
        with:
          name: netlify-dist
          path: dist
          if-no-files-found: error
          retention-days: 1

  preview:
    name: Publish pull-request preview
    if: github.event_name == 'pull_request'
    needs: [migrations, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: netlify-dist
          path: dist

      - name: Publish preview
        run: >-
          npx netlify-cli@latest deploy --dir=dist --no-build
          --site=9a9edc3b-04e4-431f-8927-f946900b0b27
          --message "PR #${{ github.event.pull_request.number }} · ${{ github.sha }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}

  production:
    name: Publish production from main
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [migrations, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: netlify-dist
          path: dist

      - name: Publish production
        run: >-
          npx netlify-cli@latest deploy --prod --dir=dist --no-build
          --site=9a9edc3b-04e4-431f-8927-f946900b0b27
          --message "GitHub ${{ github.ref_name }} · ${{ github.sha }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}

  deploy-edge-functions:
    name: Deploy api-v1 edge function to Supabase
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && secrets.SUPABASE_ACCESS_TOKEN != ''
    needs: [migrations]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v2
        with:
          version: 2.115.0

      - name: Deploy api-v1
        run: supabase functions deploy api-v1 --project-ref bsiljrrodgtmtdilnuxr
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
