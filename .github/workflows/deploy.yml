name: Validate and deploy to Netlify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('netlify-preview-{0}', github.event.pull_request.number) || 'netlify-production' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NETLIFY_CLI_VERSION: 27.5.2

jobs:
  migrations:
    name: Validate Supabase migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v2
        with:
          version: 2.115.0

      - name: Apply migrations to a clean local database
        run: |
          supabase start
          supabase db reset --local --no-seed

      - name: Run database regression tests
        run: supabase test db --local

      - name: Clean up local database
        if: always()
        run: supabase stop --no-backup

  build:
    name: Build with Netlify configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5
          cache: true

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Edge Function tests
        run: npm test

      - name: Build
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "::error::NETLIFY_AUTH_TOKEN is required to build with the site configuration."
            exit 1
          fi
          npx --yes "netlify-cli@$NETLIFY_CLI_VERSION" build --context production
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: 9a9edc3b-04e4-431f-8927-f946900b0b27

      - name: Upload production-ready build
        uses: actions/upload-artifact@v4
        with:
          name: netlify-build
          path: |
            dist
            netlify.toml
          if-no-files-found: error
          retention-days: 1

  preview:
    name: Publish pull-request preview
    if: github.event_name == 'pull_request'
    needs: [migrations, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/download-artifact@v4
        with:
          name: netlify-build
          path: .

      - name: Validate deploy inputs
        run: |
          test -s dist/index.html
          test -s netlify.toml
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "::error::NETLIFY_AUTH_TOKEN is required to publish the preview."
            exit 1
          fi
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}

      - name: Publish preview
        run: >-
          npx --yes "netlify-cli@$NETLIFY_CLI_VERSION" deploy --dir=dist --no-build
          --site=9a9edc3b-04e4-431f-8927-f946900b0b27
          --message "PR #${{ github.event.pull_request.number }} · ${{ github.sha }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}

  production:
    name: Publish production from main
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [migrations, build, release-supabase]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/download-artifact@v4
        with:
          name: netlify-build
          path: .

      - name: Validate deploy inputs
        run: |
          test -s dist/index.html
          test -s netlify.toml
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "::error::NETLIFY_AUTH_TOKEN is required to publish production."
            exit 1
          fi
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}

      - name: Publish production
        run: >-
          npx --yes "netlify-cli@$NETLIFY_CLI_VERSION" deploy --prod --dir=dist --no-build
          --site=9a9edc3b-04e4-431f-8927-f946900b0b27
          --message "GitHub ${{ github.ref_name }} · ${{ github.sha }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}

  release-supabase:
    name: Release Edge Functions and Supabase migrations
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [migrations, build]
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: bsiljrrodgtmtdilnuxr
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v2
        with:
          version: 2.115.0

      - name: Validate production release inputs
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is required to release Supabase."
            exit 1
          fi
          if [ -z "${SUPABASE_DB_PASSWORD:-}" ]; then
            echo "::error::SUPABASE_DB_PASSWORD is required to release migrations."
            exit 1
          fi
          if [ "$SUPABASE_PROJECT_ID" != "bsiljrrodgtmtdilnuxr" ]; then
            echo "::error::Unexpected Supabase project."
            exit 1
          fi

      - name: Link canonical Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Validate remote migration plan
        run: supabase db push --linked --dry-run --skip-vault

      - name: Apply pending migrations
        run: supabase db push --linked --skip-vault --yes

      - name: Verify remote migration and RPC permissions
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list --linked
          readback="$(supabase db query --linked --output json "
              select 'release_readback_ok' as status
              where exists (
                select 1
                from supabase_migrations.schema_migrations
                where version = '20260913074855'
              )
                and to_regprocedure(
                  'public.link_presale_order_customer(uuid,uuid,uuid,timestamptz,uuid)'
                ) is not null
                and to_regprocedure(
                  'public.prepare_presale_order_charge_creation(uuid,text,date,integer,text,text,uuid,timestamptz,uuid)'
                ) is not null
                and (
                  select p.prosecdef
                    and p.proconfig @> array[
                      'search_path=' || chr(34) || chr(34)
                    ]
                  from pg_catalog.pg_proc as p
                  where p.oid = to_regprocedure(
                    'public.link_presale_order_customer(uuid,uuid,uuid,timestamptz,uuid)'
                  )
                )
                and (
                  select p.prosecdef
                    and p.proconfig @> array[
                      'search_path=' || chr(34) || chr(34)
                    ]
                  from pg_catalog.pg_proc as p
                  where p.oid = to_regprocedure(
                    'public.prepare_presale_order_charge_creation(uuid,text,date,integer,text,text,uuid,timestamptz,uuid)'
                  )
                )
                and exists (
                  select 1
                  from pg_catalog.pg_trigger as tg
                  join pg_catalog.pg_class as rel
                    on rel.oid = tg.tgrelid
                  join pg_catalog.pg_namespace as ns
                    on ns.oid = rel.relnamespace
                  where ns.nspname = 'public'
                    and rel.relname = 'order_operations'
                    and tg.tgname = 'require_presale_customer_for_asaas'
                    and tg.tgfoid = to_regprocedure(
                      'eon_private.require_presale_customer_for_asaas()'
                    )
                    and tg.tgenabled <> 'D'
                    and tg.tgtype = 23
                    and not tg.tgisinternal
                )
                and exists (
                  select 1
                  from pg_catalog.pg_trigger as tg
                  join pg_catalog.pg_class as rel
                    on rel.oid = tg.tgrelid
                  join pg_catalog.pg_namespace as ns
                    on ns.oid = rel.relnamespace
                  where ns.nspname = 'public'
                    and rel.relname = 'presale_orders'
                    and tg.tgname = 'block_presale_customer_change_during_operation'
                    and tg.tgfoid = to_regprocedure(
                      'eon_private.block_presale_customer_change_during_operation()'
                    )
                    and tg.tgenabled <> 'D'
                    and tg.tgtype = 19
                    and not tg.tgisinternal
                )
                and has_function_privilege(
                  'service_role',
                  'public.link_presale_order_customer(uuid,uuid,uuid,timestamptz,uuid)',
                  'EXECUTE'
                )
                and not has_function_privilege(
                  'anon',
                  'public.link_presale_order_customer(uuid,uuid,uuid,timestamptz,uuid)',
                  'EXECUTE'
                )
                and not has_function_privilege(
                  'authenticated',
                  'public.link_presale_order_customer(uuid,uuid,uuid,timestamptz,uuid)',
                  'EXECUTE'
                )
                and has_function_privilege(
                  'service_role',
                  'public.prepare_presale_order_charge_creation(uuid,text,date,integer,text,text,uuid,timestamptz,uuid)',
                  'EXECUTE'
                )
                and not has_function_privilege(
                  'anon',
                  'public.prepare_presale_order_charge_creation(uuid,text,date,integer,text,text,uuid,timestamptz,uuid)',
                  'EXECUTE'
                )
                and not has_function_privilege(
                  'authenticated',
                  'public.prepare_presale_order_charge_creation(uuid,text,date,integer,text,text,uuid,timestamptz,uuid)',
                  'EXECUTE'
                );
            ")"
          printf '%s\n' "$readback"
          printf '%s\n' "$readback" | jq -e '
            [.. | objects | select(.status? == "release_readback_ok")]
            | length == 1
          ' >/dev/null

      - name: Deploy Edge Functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID"
