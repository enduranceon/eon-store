name: Validate and deploy to Netlify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: netlify-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build with Netlify configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx netlify-cli@latest build --context production
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: 9a9edc3b-04e4-431f-8927-f946900b0b27

      - name: Upload production-ready build
        uses: actions/upload-artifact@v4
        with:
          name: netlify-dist
          path: dist
          if-no-files-found: error
          retention-days: 1

  preview:
    name: Publish pull-request preview
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: netlify-dist
          path: dist

      - name: Publish preview
        run: >-
          npx netlify-cli@latest deploy --dir=dist --no-build
          --site=9a9edc3b-04e4-431f-8927-f946900b0b27
          --message "PR #${{ github.event.pull_request.number }} · ${{ github.sha }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}

  # As edge functions NÃO subiam junto com o site. Isso já custou caro: quatro
  # rotas mescladas na main e nunca deployadas (a aba de estoque e o vínculo de
  # cliente ficaram quebrados), e o guard de autorização das funções admin ficou
  # um mês commitado sem chegar em produção, com a create-asaas-charge aberta a
  # qualquer um com a anon key.
  #
  # Só deploya no push para a main — nunca em pull_request, para que um PR de
  # terceiro não consiga publicar função com service_role.
  #
  # NÃO aplica migration de propósito. Em 17/ago/2026, 18 das 22 versões do
  # repositório não constavam em supabase_migrations.schema_migrations: um
  # `db push` as trataria como pendentes e reaplicaria versões antigas por cima
  # do que está no ar. Enquanto o histórico não for reconciliado, migration
  # continua sendo aplicada à mão e de forma supervisionada.
  edge-functions:
    name: Deploy edge functions to Supabase
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy functions
        run: supabase functions deploy --project-ref bsiljrrodgtmtdilnuxr
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  production:
    name: Publish production from main
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: netlify-dist
          path: dist

      - name: Publish production
        run: >-
          npx netlify-cli@latest deploy --prod --dir=dist --no-build
          --site=9a9edc3b-04e4-431f-8927-f946900b0b27
          --message "GitHub ${{ github.ref_name }} · ${{ github.sha }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
